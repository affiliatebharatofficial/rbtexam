<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Vibrant Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- White Glow Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Glass Highlight -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E3A8A" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Glass Inner Highlight -->
  <rect x="36" y="36" width="440" height="220" rx="108" ry="108" fill="url(#glassGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="34" y="34" width="444" height="444" rx="110" ry="110" fill="none" stroke="#60A5FA" stroke-width="4" stroke-opacity="0.5" />

  <!-- Graduation Mortarboard / Academic Cap -->
  <g transform="translate(0, -10)">
    <!-- Cap Base / Top Rhombus -->
    <polygon points="256,120 400,185 256,250 112,185" fill="url(#whiteGrad)" />
    
    <!-- Cap Under Skull Section -->
    <path d="M172,212 L172,272 C172,318 210,344 256,344 C302,344 340,318 340,272 L340,212 L256,250 Z" fill="#E2E8F0" />
    
    <!-- Tassel String & Hanging Ribbon -->
    <path d="M256,185 Q390,200 408,245 L412,305 C412,312 404,316 398,312 L394,248 Q380,208 256,185 Z" fill="url(#cyanGrad)" />
    <!-- Tassel Button at Center -->
    <circle cx="256" cy="185" r="10" fill="url(#cyanGrad)" />
  </g>

  <!-- AI Sparkle / Star (Top Right of Cap) -->
  <g transform="translate(375, 105) scale(0.9)">
    <path d="M0,-28 Q0,0 28,0 Q0,0 0,28 Q0,0 -28,0 Q0,0 0,-28 Z" fill="url(#cyanGrad)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
  </g>

  <!-- Mini Sparkle -->
  <g transform="translate(125, 125) scale(0.55)">
    <path d="M0,-24 Q0,0 24,0 Q0,0 0,24 Q0,0 -24,0 Q0,0 0,-24 Z" fill="#93C5FD" opacity="0.85" />
  </g>

  <!-- Bold Clean "RBT" Typography with Subtle Shadow -->
  <text x="256" y="420" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="78" 
        font-weight="900" 
        letter-spacing="5"
        text-anchor="middle" 
        fill="#FFFFFF">
    RBT
  </text>
  
  <!-- "AI" Accent Sub-Badge -->
  <rect x="345" y="365" width="46" height="26" rx="8" ry="8" fill="url(#cyanGrad)" />
  <text x="368" y="383" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="16" 
        font-weight="800" 
        letter-spacing="1"
        text-anchor="middle" 
        fill="#0F172A">
    AI
  </text>
</svg>
